<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI File Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

    .wave-bar{

      width:4px;

      border-radius:999px;

      background:white;

      animation:wave 1s infinite ease-in-out;

    }

    .wave-bar:nth-child(1){

      height:8px;

      animation-delay:0s;

    }

    .wave-bar:nth-child(2){

      height:18px;

      animation-delay:0.2s;

    }

    .wave-bar:nth-child(3){

      height:10px;

      animation-delay:0.4s;

    }

    .wave-bar:nth-child(4){

      height:20px;

      animation-delay:0.6s;

    }

    @keyframes wave{

      0%{

        transform:scaleY(0.5);

        opacity:0.5;

      }

      50%{

        transform:scaleY(1.5);

        opacity:1;

      }

      100%{

        transform:scaleY(0.5);

        opacity:0.5;

      }

    }
  </style>
</head>
<body class="bg-[#0d0d0f] text-white min-h-screen overflow-hidden relative">

<canvas

    w-full
    h-full

></canvas>

  <!-- BLUE LEFT GLOW -->
<div class="absolute w-[900px] h-[900px] bg-blue-500/20 blur-[160px] rounded-full -top-80 -left-80"></div>

<!-- ORANGE RIGHT GLOW -->
<div class="absolute w-[800px] h-[800px] bg-orange-500/20 blur-[160px] rounded-full -bottom-60 -right-60"></div>

<!-- CENTER SOFT WHITE GLOW -->
<div class="absolute w-[500px] h-[500px] bg-white/5 blur-[120px] rounded-full top-[25%] left-[35%]"></div>

  <!-- BLUE PARTICLES -->
<div class="absolute top-24 left-32 w-4 h-4 bg-blue-400 rounded-full shadow-2xl animate-bounce"></div>
<div class="absolute top-44 left-44 w-2 h-2 bg-blue-300 rounded-full"></div>
<div class="absolute top-56 left-52 w-3 h-3 bg-cyan-300 rounded-full"></div>

<!-- ORANGE PARTICLES -->
<div class="absolute top-28 right-40 w-4 h-4 bg-orange-400 rounded-full animate-bounce"></div>
<div class="absolute top-48 right-52 w-3 h-3 bg-orange-500 rounded-full"></div>
<div class="absolute top-60 right-44 w-2 h-2 bg-yellow-300 rounded-full"></div>

  <!-- MAIN CONTENT -->
  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6">

    <!-- TITLE -->
    <h1
      class="
        text-[72px]
        md:text-[180px]
        font-semibold
        tracking-[-0.08em]
        text-white/90
        leading-none
        select-none
      "
      style="
        font-family:
          -apple-system,
          BlinkMacSystemFont,

          sans-serif;
      "
    >
      Alphalogix
    </h1>

    <!-- GLASS CARD -->
    <div
      class="

        max-w-4xl
        mt-8
        rounded-[36px]

    >

      <!-- TEXTAREA -->
      <textarea

>

<button

  "
>

</button>

<button
  onclick="generate('video')"

    px-6

    text-white
    font-semibold
    hover:scale-105
    active:scale-95
    transition
    shadow-2xl
    bg-gradient-to-b

    to-orange-500
  "
>
  Video Prompt
</button>
<button
  id="voiceBtn"
  onclick="startVoiceChat()"
  class="

    active:scale-95

>

  </div>

  <span id="voiceBtnText">
    Live Voice
  </span>
</button>

<button
  id="endVoiceBtn"
  onclick="stopVoiceChat()"

    px-6
    py-4

    active:scale-95
    transition
    shadow-2xl
    bg-gradient-to-b
    from-red-400
    to-red-600
  "
>
  End Call
</button>

      </div>

      <!-- LOADING -->

          font-medium
          animate-pulse
        "

        Generating magic...

    </div>

  <script>
    async function generate(type) {
      const prompt = document.getElementById('prompt').value;
      const output = document.getElementById('output');
      const loading = document.getElementById('loading');

      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }

      output.innerHTML = '';
      loading.classList.remove('hidden');

      try {
        // Call Vercel backend API
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            prompt: prompt,
            type: type
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Request failed');
        }

        const data = await response.json();

        if (type === 'text') {
          const text = data.choices?.[0]?.message?.content || 'No response';

          output.innerHTML = `
            <div class="bg-zinc-800 p-4 rounded-2xl whitespace-pre-wrap">${text}</div>
            <button onclick="downloadText()" class="bg-white text-black px-4 py-2 rounded-xl">
              Download TXT
            </button>
          `;

          window.generatedText = text;
        }

        if (type === 'image') {
          const base64 = data.data?.[0]?.b64_json;

          if (!base64) {
            output.innerHTML = '<div class="text-red-400">Image generation failed</div>';
            return;
          }

          const imageUrl = `data:image/png;base64,${base64}`;

          output.innerHTML = `
            <img src="${imageUrl}" class="rounded-2xl w-full max-w-xl" />
            <a href="${imageUrl}" download="generated.png" class="inline-block bg-blue-500 px-4 py-2 rounded-xl mt-2">
              Download Image
            </a>
          `;
        }

        if (type === 'video') {
          output.innerHTML = `
            <div class="bg-zinc-800 p-4 rounded-2xl space-y-3">
              <p class="text-lg font-semibold">AI Video Prompt</p>
              <p class="text-zinc-300">
                ${prompt}
              </p>

              <p class="text-sm text-zinc-500">
                Use this prompt with RunwayML, Sora, Pika, or Kling.
              </p>

              <button onclick="downloadVideoPrompt()" class="bg-purple-500 px-4 py-2 rounded-xl">
                Download Prompt
              </button>
            </div>
          `;

          window.videoPrompt = prompt;
        }
      } catch (e) {
        console.error(e);
        output.innerHTML = `
          <div class="bg-red-500/20 border border-red-500 p-4 rounded-2xl">
            <strong>Error:</strong> ${e.message}
          </div>
        `;
      }

      loading.classList.add('hidden');
    }

    function downloadText() {
      const blob = new Blob([window.generatedText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'generated.txt';
      a.click();
    }

    function downloadVideoPrompt() {
      const blob = new Blob([window.videoPrompt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'video_prompt.txt';
      a.click();
    }

let peerConnection;
let dataChannel;
let audioElement;

// SESSION CONFIG
const sessionUpdate = {

  type: "session.update",

  session: {

    instructions:`

You are a live classroom AI teacher.

VERY IMPORTANT:

Whenever explaining:

- charts

- graphs

- support resistance

- patterns

- arrows

- technical analysis

- math

- diagrams

- visual concepts

You MUST call draw_chart_overlay.

DO NOT only explain verbally.

ALWAYS use the tool for visual teaching.

You are expected to teach visually.

`,

    tools: [

      {
        type: "function",

        name: "draw_chart_overlay",

        description:
          "Draws animated overlays on screen",

        parameters: {

          type: "object",

          properties: {

            patternType: {
              type: "string"
            },

            points: {

              type: "array",

              items: {

                type: "object",

                properties: {

                  x: {
                    type: "number"
                  },

                  y: {
                    type: "number"
                  }
                }
              }
            },

            annotation: {
              type: "string"
            }
          }
        }
      }
    ]
  }
};

async function startVoiceChat() {

  try {

    // UI
    document
      .getElementById("voiceWave")
      .classList.remove("hidden");

    document
      .getElementById("endVoiceBtn")
      .classList.remove("hidden");

    document
      .getElementById("voiceBtnText")
      .innerText = "Connecting...";

    // WEBRTC
    peerConnection =
      new RTCPeerConnection();

    // AUDIO
    audioElement =
      document.createElement("audio");

    audioElement.autoplay = true;

    peerConnection.ontrack = e => {
      audioElement.srcObject = e.streams[0];
    };

    // MIC
    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    stream.getTracks().forEach(track => {
      peerConnection.addTrack(track, stream);
    });

    // DATA CHANNEL
    dataChannel =
      peerConnection.createDataChannel(
        "oai-events"
      );

    dataChannel.onopen = () => {

      document
        .getElementById("voiceBtnText")
        .innerText = "Live";

      // SEND SESSION CONFIG

  dataChannel.send(

    JSON.stringify(sessionUpdate)

  );
      console.log(

  "SESSION UPDATE SENT",

  sessionUpdate

);

      console.log("Voice Connected");
    };
    // LISTEN FOR AI EVENTS
dataChannel.onmessage = (event) => {

  const msg =
    JSON.parse(event.data);

  console.log("EVENT:", msg);

  // FUNCTION CALL
  if (
    msg.type ===
      "response.function_call_arguments.done"

    ||

    msg.type ===
      "response.output_item.done"
  ) {

    console.log(
      "POSSIBLE TOOL EVENT"
    );

    console.log(msg);

    if (
      msg.item &&
      msg.item.type === "function_call"
    ) {

      const args =
        JSON.parse(
          msg.item.arguments
        );

      console.log(
        "FUNCTION:",
        msg.item.name
      );

      console.log(
        "ARGS:",
        args
      );

      if (
        msg.item.name ===
        "draw_chart_overlay"
      ) {

        drawOverlay(args);
      }
    }
  }
};
    const canvas =
  document.getElementById(
    "overlayCanvas"
  );

const ctx =
  canvas.getContext("2d");

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;
}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);
    async function drawOverlay(data) {

  const points =
    data.points;

  ctx.strokeStyle =
    "#00e0ff";

  ctx.lineWidth = 4;

  ctx.shadowColor =
    "#00e0ff";

  ctx.shadowBlur = 20;

  ctx.beginPath();

  ctx.moveTo(
    points[0].x,
    points[0].y
  );

  // HUMAN DRAW ANIMATION
  for (let i = 1; i < points.length; i++) {

    const start =
      points[i - 1];

    const end =
      points[i];

    const steps = 60;

    for (let s = 0; s <= steps; s++) {

      const x =
        start.x +
        ((end.x - start.x) * s) / steps;

      const y =
        start.y +
        ((end.y - start.y) * s) / steps;

      ctx.lineTo(x, y);

      ctx.stroke();

      await new Promise(r =>
        setTimeout(r, 8)
      );
    }
  }

  // LABEL
  ctx.font =
    "18px sans-serif";

  ctx.fillStyle =
    "white";

  ctx.fillText(
    data.annotation,
    points[0].x,
    points[0].y - 20
  );
}

    // OFFER
    const offer =
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
      offer
    );

    // CONNECT TO OPENAI REALTIME
    // CONNECT TO YOUR VERCEL BACKEND
const sdpResponse = await fetch(

  "/api/realtime",

  {
    method: "POST",

    headers: {
      "Content-Type":
        "application/sdp"
    },

    body: offer.sdp
  }
);
    const answer = {
      type: "answer",
      sdp: await sdpResponse.text()
    };

    await peerConnection.setRemoteDescription(
      answer
    );

  } catch (e) {

    console.error(e);

    alert("Voice connection failed");

    stopVoiceChat();
  }
}

function stopVoiceChat() {

  if (peerConnection) {
    peerConnection.close();
  }

  document
    .getElementById("voiceWave")
    .classList.add("hidden");

  document
    .getElementById("endVoiceBtn")
    .classList.add("hidden");

  document
    .getElementById("voiceBtnText")
    .innerText = "Live Voice";
}
  </script>
</body>
