<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI File Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d0d0f] text-white min-h-screen overflow-hidden relative">

  <!-- BACKGROUND GLOW -->
  <div class="absolute w-[700px] h-[700px] bg-white/5 blur-[140px] rounded-full -top-60 -left-60 animate-pulse"></div>

  <div class="absolute w-[500px] h-[500px] bg-emerald-500/10 blur-[120px] rounded-full bottom-[-120px] right-[-120px]"></div>

  <div class="absolute w-[400px] h-[400px] bg-orange-500/10 blur-[120px] rounded-full top-[20%] right-[10%]"></div>

  <!-- FLOATING DOTS -->
  <div class="absolute top-24 left-32 w-4 h-4 bg-green-400 rounded-full shadow-2xl animate-bounce"></div>
  <div class="absolute top-44 left-44 w-2 h-2 bg-green-300 rounded-full"></div>
  <div class="absolute top-56 left-52 w-3 h-3 bg-green-500 rounded-full"></div>

  <div class="absolute top-28 right-40 w-4 h-4 bg-orange-400 rounded-full animate-bounce"></div>
  <div class="absolute top-48 right-52 w-3 h-3 bg-orange-500 rounded-full"></div>

  <!-- MAIN CONTENT -->
  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6">

    <!-- TITLE -->
    <h1
      class="
        text-[72px]
        md:text-[180px]
        font-semibold
        tracking-[-0.08em]
        text-white/90
        leading-none
        select-none
      "
      style="
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'SF Pro Display',
          sans-serif;
      "
    >
      Urbanist
    </h1>

    <!-- GLASS CARD -->
    <div
      class="
        w-full
        max-w-4xl
        mt-8
        rounded-[36px]
        border
        border-white/10
        bg-white/5
        backdrop-blur-3xl
        shadow-2xl
        p-6
        md:p-8
      "
    >

      <!-- HEADER -->
      <div class="mb-6">
        <h2 class="text-3xl font-semibold tracking-tight">
          AI Generator
        </h2>

        <p class="text-white/45 mt-2 text-lg">
          Generate text, images, or cinematic video prompts.
        </p>
      </div>

      <!-- TEXTAREA -->
      <textarea
        id="prompt"
        placeholder="Describe what you want to create..."
        class="
          w-full
          h-44
          bg-white/5
          border
          border-white/10
          rounded-[28px]
          p-6
          text-lg
          outline-none
          resize-none
          placeholder:text-white/30
          focus:border-white/30
          transition
        "
        style="
          font-family:
            -apple-system,
            BlinkMacSystemFont,
            'SF Pro Text',
            sans-serif;
        "
      ></textarea>

      <!-- BUTTONS -->
      <div class="flex flex-wrap gap-4 mt-6">

        <button
          onclick="generate('text')"
          class="
            px-6
            py-4
            rounded-2xl
            bg-white
            text-black
            font-semibold
            hover:scale-105
            active:scale-95
            transition
            shadow-xl
          "
        >
          Generate Text
        </button>

        <button
          onclick="generate('image')"
          class="
            px-6
            py-4
            rounded-2xl
            bg-blue-500/80
            backdrop-blur-xl
            font-semibold
            hover:scale-105
            active:scale-95
            transition
            shadow-xl
          "
        >
          Generate Image
        </button>

        <button
          onclick="generate('video')"
          class="
            px-6
            py-4
            rounded-2xl
            bg-purple-500/80
            backdrop-blur-xl
            font-semibold
            hover:scale-105
            active:scale-95
            transition
            shadow-xl
          "
        >
          Video Prompt
        </button>

      </div>

      <!-- LOADING -->
      <div
        id="loading"
        class="
          hidden
          mt-6
          text-yellow-300
          font-medium
          animate-pulse
        "
      >
        Generating magic...
      </div>

      <!-- OUTPUT -->
      <div
        id="output"
        class="
          mt-8
          space-y-4
        "
      ></div>

    </div>

  </div>
  <script>
    async function generate(type) {
      const prompt = document.getElementById('prompt').value;
      const output = document.getElementById('output');
      const loading = document.getElementById('loading');

      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }

      output.innerHTML = '';
      loading.classList.remove('hidden');

      try {
        // Call Vercel backend API
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            prompt: prompt,
            type: type
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Request failed');
        }

        const data = await response.json();

        if (type === 'text') {
          const text = data.choices?.[0]?.message?.content || 'No response';

          output.innerHTML = `
            <div class="bg-zinc-800 p-4 rounded-2xl whitespace-pre-wrap">${text}</div>
            <button onclick="downloadText()" class="bg-white text-black px-4 py-2 rounded-xl">
              Download TXT
            </button>
          `;

          window.generatedText = text;
        }

        if (type === 'image') {
          const base64 = data.data?.[0]?.b64_json;

          if (!base64) {
            output.innerHTML = '<div class="text-red-400">Image generation failed</div>';
            return;
          }

          const imageUrl = `data:image/png;base64,${base64}`;

          output.innerHTML = `
            <img src="${imageUrl}" class="rounded-2xl w-full max-w-xl" />
            <a href="${imageUrl}" download="generated.png" class="inline-block bg-blue-500 px-4 py-2 rounded-xl mt-2">
              Download Image
            </a>
          `;
        }

        if (type === 'video') {
          output.innerHTML = `
            <div class="bg-zinc-800 p-4 rounded-2xl space-y-3">
              <p class="text-lg font-semibold">AI Video Prompt</p>
              <p class="text-zinc-300">
                ${prompt}
              </p>

              <p class="text-sm text-zinc-500">
                Use this prompt with RunwayML, Sora, Pika, or Kling.
              </p>

              <button onclick="downloadVideoPrompt()" class="bg-purple-500 px-4 py-2 rounded-xl">
                Download Prompt
              </button>
            </div>
          `;

          window.videoPrompt = prompt;
        }
      } catch (e) {
        console.error(e);
        output.innerHTML = `
          <div class="bg-red-500/20 border border-red-500 p-4 rounded-2xl">
            <strong>Error:</strong> ${e.message}
          </div>
        `;
      }

      loading.classList.add('hidden');
    }

    function downloadText() {
      const blob = new Blob([window.generatedText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'generated.txt';
      a.click();
    }

    function downloadVideoPrompt() {
      const blob = new Blob([window.videoPrompt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'video_prompt.txt';
      a.click();
    }
  </script>
</body>
</html>
