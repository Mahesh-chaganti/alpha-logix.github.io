<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI File Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-4xl bg-zinc-900 rounded-3xl shadow-2xl p-6 space-y-6">
    <div>
      <h1 class="text-4xl font-bold">AI File Generator</h1>
      <p class="text-zinc-400 mt-2">
        Generate text, images, or video prompts using OpenAI.
      </p>
    </div>

    <textarea
      id="prompt"
      placeholder="Describe what you want..."
      class="w-full h-40 bg-zinc-800 rounded-2xl p-4 outline-none border border-zinc-700 focus:border-white resize-none"
    ></textarea>

    <div class="flex flex-wrap gap-3">
      <button onclick="generate('text')" class="bg-white text-black px-5 py-3 rounded-2xl font-semibold hover:scale-105 transition">
        Generate Text
      </button>

      <button onclick="generate('image')" class="bg-blue-500 px-5 py-3 rounded-2xl font-semibold hover:scale-105 transition">
        Generate Image
      </button>

      <button onclick="generate('video')" class="bg-purple-500 px-5 py-3 rounded-2xl font-semibold hover:scale-105 transition">
        Generate Video Prompt
      </button>
    </div>

    <div id="loading" class="hidden text-yellow-400 font-medium">
      Generating...
    </div>

    <div id="output" class="space-y-4"></div>
  </div>

  <script>
    async function generate(type) {
      const prompt = document.getElementById('prompt').value;
      const output = document.getElementById('output');
      const loading = document.getElementById('loading');

      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }

      output.innerHTML = '';
      loading.classList.remove('hidden');

      try {
        // Call Vercel backend API
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            prompt: prompt,
            type: type
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Request failed');
        }

        const data = await response.json();

        if (type === 'text') {
          const text = data.choices?.[0]?.message?.content || 'No response';

          output.innerHTML = `
            <div class="bg-zinc-800 p-4 rounded-2xl whitespace-pre-wrap">${text}</div>
            <button onclick="downloadText()" class="bg-white text-black px-4 py-2 rounded-xl">
              Download TXT
            </button>
          `;

          window.generatedText = text;
        }

        if (type === 'image') {
          const base64 = data.data?.[0]?.b64_json;

          if (!base64) {
            output.innerHTML = '<div class="text-red-400">Image generation failed</div>';
            return;
          }

          const imageUrl = `data:image/png;base64,${base64}`;

          output.innerHTML = `
            <img src="${imageUrl}" class="rounded-2xl w-full max-w-xl" />
            <a href="${imageUrl}" download="generated.png" class="inline-block bg-blue-500 px-4 py-2 rounded-xl mt-2">
              Download Image
            </a>
          `;
        }

        if (type === 'video') {
          output.innerHTML = `
            <div class="bg-zinc-800 p-4 rounded-2xl space-y-3">
              <p class="text-lg font-semibold">AI Video Prompt</p>
              <p class="text-zinc-300">
                ${prompt}
              </p>

              <p class="text-sm text-zinc-500">
                Use this prompt with RunwayML, Sora, Pika, or Kling.
              </p>

              <button onclick="downloadVideoPrompt()" class="bg-purple-500 px-4 py-2 rounded-xl">
                Download Prompt
              </button>
            </div>
          `;

          window.videoPrompt = prompt;
        }
      } catch (e) {
        console.error(e);
        output.innerHTML = `
          <div class="bg-red-500/20 border border-red-500 p-4 rounded-2xl">
            <strong>Error:</strong> ${e.message}
          </div>
        `;
      }

      loading.classList.add('hidden');
    }

    function downloadText() {
      const blob = new Blob([window.generatedText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'generated.txt';
      a.click();
    }

    function downloadVideoPrompt() {
      const blob = new Blob([window.videoPrompt], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'video_prompt.txt';
      a.click();
    }
  </script>
</body>
</html>
