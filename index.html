<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alphalogix Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d0d0f] text-white min-h-screen overflow-hidden relative">

  <!-- SYSTEM INTERACTION PAINT OVERLAY -->
  <canvas id="overlayCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-[9999]"></canvas>

  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6">
    <h1 class="text-[54px] md:text-[120px] font-semibold tracking-[-0.08em] text-white/90 leading-none select-none">
      Alphalogix
    </h1>

    <div class="w-full max-w-2xl mt-8 rounded-[36px] border border-white/10 bg-white/5 backdrop-blur-3xl p-8 flex flex-col items-center gap-6">
      <p class="text-white/60 text-center">Click Live Voice below and tell the AI model: <br><span class="text-cyan-400 font-mono">"Draw an upward trend line across my view."</span></p>
      
      <div class="flex gap-4">
        <button id="voiceBtn" class="px-6 py-4 rounded-2xl font-semibold bg-gradient-to-b from-cyan-400 to-blue-600 shadow-xl transition active:scale-95">
          Live Voice
        </button>
        <button id="endVoiceBtn" class="hidden px-6 py-4 rounded-2xl font-semibold bg-gradient-to-b from-red-400 to-red-600 shadow-xl transition active:scale-95">
          End Call
        </button>
      </div>
    </div>
  </div>

  <!-- APPLICATION CONTROLLER DISPATCHER -->
  <script type="module">
    import { initVoiceChat, closeVoiceChat } from './realtime.js';

    const voiceBtn = document.getElementById("voiceBtn");
    const endVoiceBtn = document.getElementById("endVoiceBtn");

    voiceBtn.addEventListener("click", async () => {
      voiceBtn.innerText = "Connecting...";
      voiceBtn.disabled = true;

      await initVoiceChat(
        // Connection Success Handler
        () => {
          voiceBtn.innerText = "Live Connected";
          endVoiceBtn.classList.remove("hidden");
        },
        // Disconnect Handler
        () => { resetUi(); }
      );
    });

    endVoiceBtn.addEventListener("click", () => {
      closeVoiceChat();
      resetUi();
    });

    function resetUi() {
      voiceBtn.innerText = "Live Voice";
      voiceBtn.disabled = false;
      endVoiceBtn.classList.add("hidden");
    }
  </script>
</body>
</html>
